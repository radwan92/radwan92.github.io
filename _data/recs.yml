    I've worked with Filip for well over 5 years. He’s a genuinely exceptional engineer. He has high standards for his own work and pushes others not to settle for mediocrity. I’ve seen him tackle challenges outside of his comfort zone. I’ve seen him grow both as a skilled individual and as a charismatic leader.

