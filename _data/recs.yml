  content: |
    Since joining coherence, Filip has designed and implemented entire systems by himself, worked with others to tackle very complex architectural challenges, and successfully lead our entire engineering team. I got to know him as a diligent, thorough and effective programmer who cares as much about what he builds as how it is built. He is detail-oriented while never losing the big picture out of sight.

    As a leader, he cares deeply about the people he works with and is always available to help or support others. He considers different opinions and perspectives carefully and doesn’t hesitate to accept that he might be wrong or that others had better ideas than his own. He is incredibly humble, easy to talk to and I cannot say how much I appreciate his help for me and the team over the past few years.

    What matters even more is that Filip is always interested to learn and to become better at what he is doing. This is not limited to becoming a better programmer but also about how he can become a better leader, a better team member or generally just a better person. Since I started working with Filip I have seen him evolve several times. From an amazing developer to a great team member and colleague to an even better leader.

    I cannot recommend Filip highly enough for any technical role being it in a development or in a leadership capacity. I am fully convinced that he will help any team to become better, more effective, more focussed and more resilient.
