    I had the pleasure of working closely with Filip during my time on the network engineering team —where he acted as product owner with great skill— and I have continued to see him grow into his current role as Head of Engineering at coherence.

    Filip combines strong technical expertise with a natural drive to keep learning and evolving. As a leader, he is a great team builder who cares about creating a positive atmosphere and supporting the well-being of his teammates. In meetings, he consistently keeps discussions focused, asking the right questions and offering constructive feedback that moves projects forward.

    Since stepping into the Head of Engineering role, he has improved our engineering workflows, directly increasing both the speed and overall quality of our releases. Any team or organization would be fortunate to have him.
