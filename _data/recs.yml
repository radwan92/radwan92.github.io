  content: |
    I've worked with Filip for several years and in that time he has progressed from the role of senior engineer on the core networking engine for cohrerence SDK, to the head of engineering overseeing all of the engineering efforts across our full stack.

    As an engineer, Filip is efficient, collaborative, and pushes for very high standards among his peers. He embodies the spirit of constructive criticism for the mutual benefit of learning in pull request reviews and when developing new technical concepts.I have often found it rewarding to be challenged by him on an approach or concept because the results of such discussions always leave us with a better product. He has a great breadth of knowledge in software engineering as well as a huge depth of experience in the specific application of technology in the area of game networking.

    As the head of engineering, Filip has really developed his ability to match the challenges of software development with the frontiers of technical product development. He continually learns to improve processes and integrations for rapidly evolving, customer-driven applications. He helped our team build a process that was complete but also lean so that the overhead of production and milestones and general paperwork was reduced to the bare minimum so that we could operate with the least amount of resistance. I see that his ability to adapt and learn and grow has made him a very effective head of engineering and an excellent leader.

    I recommend Filip as either a senior engineer or as the head of a group of engineering teams. I regard him highly as both a friend and a peer.
